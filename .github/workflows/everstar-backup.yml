name: Encrypted EVERSTAR backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: everstar-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "Missing BACKUP_ENCRYPTION_KEY" && exit 1)

      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Authenticate Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Export application, Auth and Storage database schemas/data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm --network host -v "$PWD:/backup" -w /backup \
            postgres:17 pg_dump --format=custom --no-owner --no-acl \
            --schema=public --schema=auth --schema=storage \
            --file=everstar.dump "$SUPABASE_DB_URL"

      - name: Export private memory attachments
        env:
          SUPABASE_PROJECT_REF: cehddtgitnrquvsaoztx
        run: |
          mkdir -p storage
          supabase storage cp ss:///memory-attachments ./storage/memory-attachments --recursive --experimental --remote="$SUPABASE_PROJECT_REF"

      - name: Encrypt backup archive
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          tar -czf everstar-backup.tar.gz everstar.dump storage
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --output "everstar-backup-$(date -u +%Y%m%dT%H%M%SZ).tar.gz.gpg" \
            everstar-backup.tar.gz

      - name: Verify encrypted backup and PostgreSQL dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          backup_file="$(find . -maxdepth 1 -name 'everstar-backup-*.tar.gz.gpg' -print -quit)"
          test -n "$backup_file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --decrypt --output /tmp/everstar-verify.tar.gz "$backup_file"
          tar -tzf /tmp/everstar-verify.tar.gz >/dev/null
          mkdir -p /tmp/everstar-restore-check
          tar -xzf /tmp/everstar-verify.tar.gz -C /tmp/everstar-restore-check
          test -s /tmp/everstar-restore-check/everstar.dump
          docker run --rm -v /tmp/everstar-restore-check:/backup postgres:17 \
            pg_restore --list /backup/everstar.dump >/dev/null
          test -d /tmp/everstar-restore-check/storage/memory-attachments
          echo "Encrypted archive integrity and PostgreSQL dump catalog verified."

      - name: Remove plaintext backup material
        run: |
          rm -f everstar.dump everstar-backup.tar.gz
          rm -rf storage /tmp/everstar-verify.tar.gz /tmp/everstar-restore-check

      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: everstar-encrypted-backup-${{ github.run_id }}
          path: everstar-backup-*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30

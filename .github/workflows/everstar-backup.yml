name: Encrypted EVERSTAR backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: everstar-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "Missing BACKUP_ENCRYPTION_KEY" && exit 1)

      - uses: actions/checkout@v4

      - name: Export application, Auth and Storage database schemas/data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm --network host -v "$PWD:/backup" -w /backup \
            postgres:17 pg_dump --format=custom --no-owner --no-acl \
            --schema=public --schema=auth --schema=storage \
            --file=everstar.dump "$SUPABASE_DB_URL"

      - name: Export private memory attachments
        env:
          SUPABASE_URL: https://cehddtgitnrquvsaoztx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p storage/memory-attachments
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const base = process.env.SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const bucket = 'memory-attachments';
          const root = path.resolve('storage', bucket);
          const headers = { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };
          await mkdir(root, { recursive: true });

          async function listFolder(prefix = '') {
            let offset = 0;
            while (true) {
              const response = await fetch(`${base}/storage/v1/object/list/${bucket}`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ prefix, limit: 100, offset, sortBy: { column: 'name', order: 'asc' } })
              });
              if (!response.ok) throw new Error(`Storage listing failed (${response.status}) for ${prefix}`);
              const entries = await response.json();
              if (!Array.isArray(entries)) throw new Error('Unexpected Storage listing response');
              for (const entry of entries) {
                const relative = prefix ? `${prefix}/${entry.name}` : entry.name;
                if (entry.id == null && entry.metadata == null) {
                  await listFolder(relative);
                  continue;
                }
                const objectPath = relative.split('/').map(encodeURIComponent).join('/');
                const download = await fetch(`${base}/storage/v1/object/authenticated/${bucket}/${objectPath}`, {
                  headers: { apikey: key, Authorization: 'Bearer ' + key }
                });
                if (!download.ok) throw new Error(`Storage download failed (${download.status}) for ${relative}`);
                const destination = path.resolve(root, ...relative.split('/'));
                if (!destination.startsWith(root + path.sep)) throw new Error('Unsafe storage object path');
                await mkdir(path.dirname(destination), { recursive: true });
                await writeFile(destination, new Uint8Array(await download.arrayBuffer()));
              }
              if (entries.length < 100) break;
              offset += entries.length;
            }
          }

          await listFolder();
          NODE

      - name: Encrypt backup archive
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          tar -czf everstar-backup.tar.gz everstar.dump storage
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --output "everstar-backup-$(date -u +%Y%m%dT%H%M%SZ).tar.gz.gpg" \
            everstar-backup.tar.gz

      - name: Verify encrypted backup and PostgreSQL dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          backup_file="$(find . -maxdepth 1 -name 'everstar-backup-*.tar.gz.gpg' -print -quit)"
          test -n "$backup_file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --decrypt --output /tmp/everstar-verify.tar.gz "$backup_file"
          tar -tzf /tmp/everstar-verify.tar.gz >/dev/null
          mkdir -p /tmp/everstar-restore-check
          tar -xzf /tmp/everstar-verify.tar.gz -C /tmp/everstar-restore-check
          test -s /tmp/everstar-restore-check/everstar.dump
          docker run --rm -v /tmp/everstar-restore-check:/backup postgres:17 \
            pg_restore --list /backup/everstar.dump >/dev/null
          test -d /tmp/everstar-restore-check/storage/memory-attachments
          echo "Encrypted archive integrity and PostgreSQL dump catalog verified."

      - name: Remove plaintext backup material
        run: |
          rm -f everstar.dump everstar-backup.tar.gz
          rm -rf storage /tmp/everstar-verify.tar.gz /tmp/everstar-restore-check

      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: everstar-encrypted-backup-${{ github.run_id }}
          path: everstar-backup-*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
